# Fabrica l'instal·lador de DICTAR en un ordinador Windows de GitHub.
# S'engega sol cada vegada que es puja un canvi, o a mà des de «Actions».
name: Fabrica DICTAR per a Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal·la les peces
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Fes la icona
        run: python build/fes_icona.py

      - name: Fabrica DICTAR.exe
        run: pyinstaller build/dictar.spec --noconfirm --distpath dist --workpath obra

      - name: Prova que el programa arrenca
        timeout-minutes: 5
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\DICTAR\DICTAR.exe" -ArgumentList "--prova" -Wait -PassThru
          $registre = Join-Path $env:APPDATA "DICTAR\registre.txt"
          if (Test-Path $registre) { Get-Content $registre }
          if ($p.ExitCode -ne 0) { throw "La prova ha fallat (codi $($p.ExitCode))" }
          if (-not (Select-String -Path $registre -Pattern "PROVA OK" -Quiet)) { throw "No s'ha trobat PROVA OK" }

      - name: Fabrica l'instal·lador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "build\dictar.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup ha fallat" }

      - name: Desa l'instal·lador
        uses: actions/upload-artifact@v4
        with:
          name: Instal-la-DICTAR
          path: sortida/Instal-la-DICTAR.exe

      - name: Publica'l a «Releases» (enllaç per als amics)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: darrera-versio
          name: DICTAR per a Windows
          body: |
            Baixa **Instal-la-DICTAR.exe** i fes-hi doble clic.
            Si Windows avisa «Windows ha protegit l'ordinador», clica «Més informació» i després «Executa igualment».
          files: sortida/Instal-la-DICTAR.exe
          make_latest: true
